services:
  web:
    build: .
    volumes:
      # Bind mount for live reload: runserver picks up host edits without a
      # rebuild. The named volume keeps the downloaded embedding model outside
      # the container filesystem so it survives rebuilds.
      - .:/app
      - hf-cache:/opt/hf-cache
    ports:
      - "8000:8000"
    env_file:
      - .env
    # Keeps stdin and a TTY attached so a breakpoint() in application code
    # drops into a usable pdb prompt instead of hanging the request.
    stdin_open: true
    tty: true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-worker:
    build: .
    # Same image as web on purpose: the worker imports the same services, the
    # same models, and the same embedding provider, so a separate leaner image
    # would only be leaner until the first task needed something it lacked.
    #
    # -A config finds the app re-exported from config/__init__.py. No
    # --autoreload equivalent is wired up: Celery's watchdog reloader is
    # explicitly documented as unsuitable for anything but experimentation, so
    # a code change means `docker compose restart celery-worker`.
    #
    # --concurrency=2 is a memory decision, not a throughput one. The prefork
    # pool forks one child per concurrency slot and each child that runs an
    # embedding task loads its own copy of all-MiniLM-L6-v2 into RAM.
    command: celery -A config worker --loglevel=info --concurrency=2
    volumes:
      # The bind mount keeps worker code in step with host edits after a
      # restart. hf-cache is not optional here: the worker is now the process
      # that loads the embedding model, and without the shared volume it
      # downloads its own copy on first task instead of reusing web's.
      - .:/app
      - hf-cache:/opt/hf-cache
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    # Must stay on the pgvector image. The stock postgres image has no vector
    # extension binary, so the enable_pgvector migration cannot succeed on it.
    image: pgvector/pgvector:pg17
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      # -h 127.0.0.1 is deliberate. On a fresh volume the image runs initdb
      # against a temporary server that listens on the unix socket only, and a
      # socket-based pg_isready would report healthy during that window. Testing
      # TCP is also what web actually needs, since it connects over TCP.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres-data:
  hf-cache:
